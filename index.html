<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج ولجنة الرأفة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">نظام إدارة نتائج الطلاب</h4>
                </div>
                <div class="card-body">
                    
                    <!-- صندوق رسائل الخطأ (فارغ في البداية) -->
                    <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

                    <!-- حقول الإدخال -->
                    <div class="mb-3">
                        <label for="studentName" class="form-label">اسم الطالب:</label>
                        <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم الطالب">
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="grade1" class="form-label">درجة المادة الأولى:</label>
                            <input type="number" id="grade1" class="form-control" placeholder="0 - 100">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="grade2" class="form-label">درجة المادة الثانية:</label>
                            <input type="number" id="grade2" class="form-control" placeholder="0 - 100">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="grade3" class="form-label">درجة المادة الثالثة:</label>
                            <input type="number" id="grade3" class="form-control" placeholder="0 - 100">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="attendance" class="form-label">نسبة الحضور (%):</label>
                        <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
                    </div>

                    <!-- أزرار التحكم -->
                    <div class="d-flex gap-2 justify-content-between">
                        <button id="addStudentBtn" class="btn btn-success w-50">إضافة طالب</button>
                        <button id="mercyBtn" class="btn btn-warning w-50 fw-bold">تفعيل لجنة الرأفة</button>
                    </div>

                </div>
            </div>

            <!-- صندوق عرض قائمة الطلاب -->
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">قائمة الطلاب المسجلين</h5>
                </div>
                <div class="card-body">
                    <div id="studentsListBox" class="list-group"></div>
                </div>
            </div>

            <!-- صندوق عرض التقرير النهائي للجنة الرأفة -->
            <div id="reportBox" class="mt-4"></div>

        </div>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
